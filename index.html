<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes — Note-taking App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear.</p>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>
        <form id="note-form">
          <div class="field field-grow">
            <label for="note-input">Note</label>
            <input
              type="text"
              id="note-input"
              name="note"
              placeholder="Type a note..."
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="note-category">Category</label>
            <select id="note-category" name="category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
            </select>
          </div>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" role="alert"></p>
      </section>

      <section>
        <h2>Your notes</h2>
        <div class="search-row">
          <label for="search-input">Search</label>
          <input
            type="search"
            id="search-input"
            placeholder="Search notes..."
            autocomplete="off"
          />
        </div>
        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
        <button id="clear-all-btn" type="button" class="clear-all-btn">
          Clear all
        </button>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
